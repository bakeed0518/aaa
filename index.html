<!DOCTYPE html>

<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Whitney:wght@400;500;600;700&display=swap');
        body {
            margin: 0;

            background: #0a0a0a;
            color: #dcddde;
            font-family: 'Whitney', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 30px;

        h1 {
            color: #f04747;
            font-size: 34px;

            margin-bottom: 35px;

        }
        p {
            color: #b9bbbe;
            line-height: 1.7;
            font-size: 16.5px;
            margin-bottom: 40px;
        }
        .threat {
            color: #f04747;
            font-weight: 700;
        }

</head>
